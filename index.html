<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Video Site</title>
  <style>
    /* Reset */
    * { margin:0; padding:0; box-sizing:border-box; }

    html, body {
      height: 100%;
      width: 100%;
      font-family: sans-serif;
      background: #000;
      overflow: hidden;
    }

    /* Splash screen */
    #splash {
      position: absolute;
      top:0; left:0;
      width: 100%; height: 100%;
      background: #000 url('poster.jpg') center/cover no-repeat; /* optional preview image */
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: #fff;
      z-index: 10;
    }

    #splash button {
      padding: 1em 2em;
      font-size: 1.5em;
      background: rgba(255,255,255,0.2);
      border: 2px solid #fff;
      color: #fff;
      cursor: pointer;
      transition: 0.3s;
    }

    #splash button:hover {
      background: rgba(255,255,255,0.5);
    }

    /* Video container */
    #videoContainer {
      position: absolute;
      top:0; left:0;
      width: 100%; height: 100%;
      display: none; /* hidden until click */
    }

    #videoContainer video {
      position: absolute;
      top:50%;
      left:50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translate(-50%, -50%);
      object-fit: cover; /* fills screen without black bars */
    }

    /* Optional play button to unmute */
    #unmuteButton {
      position: absolute;
      bottom: 20px;
      right: 20px;
      padding: 0.5em 1em;
      background: rgba(255,255,255,0.2);
      color: #fff;
      border: 2px solid #fff;
      cursor: pointer;
      display: none; /* only shows if muted autoplay blocked */
    }
  </style>
</head>
<body>

  <!-- Splash screen -->
  <div id="splash">
    <h1>Welcome</h1>
    <button id="enterBtn">Click to Enter</button>
  </div>

  <!-- Video container -->
  <div id="videoContainer">
    <video id="myVideo" autoplay muted loop playsinline preload="auto">
      <source src="video.mp4" type="video/mp4">
      Your browser does not support HTML5 video.
    </video>
    <button id="unmuteButton">Unmute</button>
  </div>

  <script>
    const splash = document.getElementById('splash');
    const enterBtn = document.getElementById('enterBtn');
    const videoContainer = document.getElementById('videoContainer');
    const video = document.getElementById('myVideo');
    const unmuteButton = document.getElementById('unmuteButton');

    // Show video after splash click
    enterBtn.addEventListener('click', () => {
      splash.style.display = 'none';
      videoContainer.style.display = 'block';
      video.play().catch(() => {
        // Show unmute button if autoplay blocked
        unmuteButton.style.display = 'block';
      });
    });

    // Unmute on button click
    unmuteButton.addEventListener('click', () => {
      video.muted = false;
      video.play();
      unmuteButton.style.display = 'none';
    });
  </script>

</body>
</html>
