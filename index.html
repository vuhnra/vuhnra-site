<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vuhnra</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:black;
  overflow:hidden;
  color:white;
  font-family:Helvetica, Arial, sans-serif;
}

#bgVideo{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  filter:brightness(.45) contrast(1.1);
}

#overlay{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  letter-spacing:6px;
  cursor:pointer;
  z-index:10;
  transition:opacity 1s ease;
}

.hidden{
  opacity:0;
  pointer-events:none;
}

#main{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  opacity:0;
  transition:opacity 1.2s ease;
}

#main.show{
  opacity:1;
}

h1{
  font-size:56px;
  font-weight:300;
  letter-spacing:10px;
  text-transform:lowercase;
}

.subtitle{
  margin-top:12px;
  font-size:12px;
  opacity:.65;
  letter-spacing:4px;
}

#socials{
  position:fixed;
  bottom:40px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:32px;
  font-size:13px;
  letter-spacing:3px;
}

#socials a{
  color:white;
  text-decoration:none;
  opacity:.6;
  transition:.25s;
}

#socials a:hover{
  opacity:1;
}

#discord-card{
  position:fixed;
  top:24px;
  left:24px;
  display:flex;
  gap:12px;
  align-items:center;
  background:rgba(0,0,0,.25);
  backdrop-filter:blur(10px);
  padding:10px 14px;
  border-radius:14px;
}

#discord-avatar{
  width:40px;
  height:40px;
  border-radius:50%;
}

#discord-name{
  font-size:13px;
}

#discord-status{
  font-size:11px;
  opacity:.65;
  margin-top:2px;
}
</style>
</head>
<body>

<video id="bgVideo" loop playsinline>
  <source src="video.mp4" type="video/mp4">
</video>

<div id="overlay">click to enter</div>

<div id="main">
  <h1>vuhnra</h1>
  <div class="subtitle">digital archive</div>

  <div id="socials">
    <a href="https://discord.gg/YOURINVITE" target="_blank">discord</a>
    <a href="https://instagram.com/YOURUSERNAME" target="_blank">instagram</a>
  </div>
</div>

<div id="discord-card">
  <img id="discord-avatar" src="">
  <div>
    <div id="discord-name">loading...</div>
    <div id="discord-status"></div>
  </div>
</div>

<script>
const overlay = document.getElementById("overlay");
const video = document.getElementById("bgVideo");
const main = document.getElementById("main");

video.pause();

overlay.addEventListener("click", () => {
  overlay.classList.add("hidden");
  main.classList.add("show");
  video.play();
});

fetch("https://api.lanyard.rest/v1/users/178906698440900608")
.then(r => r.json())
.then(data => {
  const user = data.data.discord_user;

  document.getElementById("discord-avatar").src =
    `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`;

  document.getElementById("discord-name").innerText =
    user.username;

  document.getElementById("discord-status").innerText =
    data.data.discord_status;
});
</script>

</body>
</html>
